# Production stack: nginx proxy + static container. No database (the site is
# static).
#
#   HTTP  without TLS (default):  docker compose -f docker-compose.prod.yml up --build
#   HTTPS with a real domain:     TLS_ENABLED=1 docker compose -f docker-compose.prod.yml --profile tls up --build -d
#
# The proxy listens on port 80 and reverse proxies to `web`. With TLS_ENABLED=1
# port 80 only answers the ACME challenge and redirects to HTTPS; the `certbot`
# service (`tls` profile) issues and renews the certificate.
#
# NOTE: the shared edge-proxy (edge-proxy repo) also publishes 80/443 and
# reaches this container as `e2e-web` on the external `edge-net` network. This
# stack's own `proxy`/`certbot` are superseded and must eventually be removed;
# until then they conflict with edge-proxy for the host's port 80/443.

services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TLS_ENABLED: ${TLS_ENABLED:-0}
      SERVER_NAME: ${SERVER_NAME:-endtoendsolutions.dev}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # The templates live outside conf.d so nginx does not load them
      # directly: the entrypoint copies only the chosen one.
      - ./nginx/nginx.prod.conf:/etc/nginx/site-conf.d/prod.conf:ro
      - ./nginx/nginx.local.conf:/etc/nginx/site-conf.d/local.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      web:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_GA_MEASUREMENT_ID: ${PUBLIC_GA_MEASUREMENT_ID:-}
    image: endtoendsolutions/site:prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on: []
    networks:
      # `default` is kept because this stack's own `proxy` still resolves
      # `web` over the project network. It can go once this stack stops
      # publishing its own proxy.
      default:
      # `edge-net` is the external network of the shared proxy (edge-proxy),
      # which routes endtoendsolutions.dev to this container. The alias must be
      # unique across the whole network: without it, two projects with a `web`
      # service would register the same name in Docker's DNS.
      edge-net:
        aliases:
          - e2e-web

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    profiles:
      - tls
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - proxy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ ! -d /etc/letsencrypt/live/${SERVER_NAME:-endtoendsolutions.dev} ]; then
          certbot certonly --webroot -w /var/www/certbot \
          --email ${LETSENCRYPT_EMAIL:-paulo.ismalej@gmail.com} \
          --non-interactive --agree-tos --no-eff-email \
          -d ${SERVER_NAME:-endtoendsolutions.dev};
        fi;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h;
        done

volumes:
  certbot-certs:
  certbot-webroot:

networks:
  # Shared proxy network. External: the host creates it once
  # (`docker network create edge-net`) and every stack shares it.
  edge-net:
    external: true