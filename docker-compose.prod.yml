# Production stack: static web container behind external edge-proxy.
# The external reverse proxy (separate "edge-proxy" repo) reaches this service
# via the external Docker network "edge-net" using the alias "e2e-web".

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_GA_MEASUREMENT_ID: ${PUBLIC_GA_MEASUREMENT_ID:-}
    image: endtoendsolutions/site:prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on: []
    networks:
      default:
      edge-net:
        aliases:
          - e2e-web

networks:
  # Shared proxy network. External: created once on the host
  # (`docker network create edge-net`) and shared by all stacks.
  edge-net:
    external: true
