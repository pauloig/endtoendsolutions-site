# Stack de producción: proxy nginx + contenedor de estáticos. Sin base de
# datos (el sitio es estático).
#
#   HTTP  sin TLS (por defecto):   docker compose -f docker-compose.prod.yml up --build
#   HTTPS con dominio real:        TLS_ENABLED=1 docker compose -f docker-compose.prod.yml --profile tls up --build -d
#
# El proxy sirve en el puerto 80 y hace reverse proxy hacia `web`. Con
# TLS_ENABLED=1 el puerto 80 sólo responde al reto ACME y redirige a HTTPS;
# el servicio `certbot` (perfil `tls`) emite y renueva el certificado.

services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TLS_ENABLED: ${TLS_ENABLED:-0}
      SERVER_NAME: ${SERVER_NAME:-endtoendsolutions.dev}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Las plantillas viven fuera de conf.d para que nginx no las cargue
      # directamente: el entrypoint copia solo la elegida.
      - ./nginx/nginx.prod.conf:/etc/nginx/site-conf.d/prod.conf:ro
      - ./nginx/nginx.local.conf:/etc/nginx/site-conf.d/local.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      web:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_GA_MEASUREMENT_ID: ${PUBLIC_GA_MEASUREMENT_ID:-}
    image: endtoendsolutions/site:prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on: []

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    profiles:
      - tls
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - proxy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ ! -d /etc/letsencrypt/live/${SERVER_NAME:-endtoendsolutions.dev} ]; then
          certbot certonly --webroot -w /var/www/certbot \
          --email ${LETSENCRYPT_EMAIL:-paulo.ismalej@gmail.com} \
          --non-interactive --agree-tos --no-eff-email \
          -d ${SERVER_NAME:-endtoendsolutions.dev};
        fi;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h;
        done

volumes:
  certbot-certs:
  certbot-webroot: