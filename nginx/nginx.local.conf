# Configuración sin TLS: reverse proxy en HTTP plano. Se usa por defecto para
# poder levantar el stack localmente (`docker compose -f
# docker-compose.prod.yml up --build`) sin depender de un dominio real ni de
# certificados. Habilita el mismo comportamiento de producción con
# TLS_ENABLED=1 cuando el dominio resuelva y certbot haya emitido el
# certificado.
#
# El dominio se sustituye en el arranque con el token @SERVER_NAME@
# (ver nginx/entrypoint.sh).
server {
    listen 80;
    server_name @SERVER_NAME@ _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mantiene el status 404 real del contenedor `web`.
        proxy_intercept_errors off;
    }
}