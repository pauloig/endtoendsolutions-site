# TLS-less configuration: plain HTTP reverse proxy. Used by default so the
# stack can be brought up locally (`docker compose -f
# docker-compose.prod.yml up --build`) without depending on a real domain or on
# certificates. Set TLS_ENABLED=1 to get the same production behaviour once the
# domain resolves and certbot has issued the certificate.
#
# The domain is substituted at boot with the @SERVER_NAME@ token
# (see nginx/entrypoint.sh).
server {
    listen 80;
    server_name @SERVER_NAME@ _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keeps the real 404 status from the `web` container.
        proxy_intercept_errors off;
    }
}