# App container: serves the static files generated by Astro.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Security headers at server level: they are inherited by every
    # location that does not declare its own add_header directives.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Hashed assets (Vite) are cached forever.
    # `expires` is used instead of `add_header Cache-Control` so it does not
    # break the inheritance of the security headers above.
    location /_astro/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location / {
        # Astro generates a 404.html: `error_page` serves it with a real 404 status,
        # not a 200 with the error page (soft 404).
        # `$uri/index.html` instead of `$uri/` avoids the internal 301 nginx
        # emits when resolving a directory, saving a round-trip per page.
        try_files $uri $uri/index.html $uri.html =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}