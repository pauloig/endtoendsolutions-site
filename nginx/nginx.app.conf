# App container: sirve los estáticos generados por Astro.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Cabeceras de seguridad a nivel de servidor: se heredan en todos los
    # locations que no declaren sus propias directivas add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Los assets con hash en el nombre (Vite) se cachean para siempre.
    # Se usa `expires` en lugar de `add_header Cache-Control` para no romper
    # la herencia de las cabeceras de seguridad de arriba.
    location /_astro/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location / {
        # Astro genera una 404.html: `error_page` la sirve con status 404 real,
        # no como un 200 con la página de error (soft 404).
        # `$uri/index.html` en lugar de `$uri/` evita el 301 interno que nginx
        # emite al resolver un directorio, ahorrando un round-trip por página.
        try_files $uri $uri/index.html $uri.html =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}