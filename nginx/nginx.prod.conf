# Production proxy: port 80 answers the ACME challenge (http-01) and redirects
# to HTTPS; HTTPS reverse proxies to the `web` container.
#
# The domain is substituted at boot with the @SERVER_NAME@ token
# (see nginx/entrypoint.sh).
server {
    listen 80;
    server_name @SERVER_NAME@;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name @SERVER_NAME@;

    ssl_certificate /etc/letsencrypt/live/@SERVER_NAME@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@SERVER_NAME@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx does not intercept upstream errors by default: Astro's 404 reaches the
        # client with its real status.
        proxy_intercept_errors off;
    }
}