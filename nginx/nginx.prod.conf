# Proxy de producción: puerto 80 resuelve el reto ACME (http-01) y redirige a
# HTTPS; HTTPS actúa como reverse proxy hacia el contenedor `web`.
#
# El dominio se sustituye en el arranque con el token @SERVER_NAME@
# (ver nginx/entrypoint.sh).
server {
    listen 80;
    server_name @SERVER_NAME@;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name @SERVER_NAME@;

    ssl_certificate /etc/letsencrypt/live/@SERVER_NAME@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@SERVER_NAME@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx no intercepta los errores del upstream por defecto: el 404 de
        # Astro llega al cliente con su status real.
        proxy_intercept_errors off;
    }
}